name: Build Location Simulator

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pick Xcode
        run: |
          ls /Applications | grep -i xcode
          XC=$(ls -d /Applications/Xcode_16.4.app 2>/dev/null || ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install ldid, make, Theos
        run: |
          brew install ldid make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS14.5.sdk
          mkdir -p $HOME/theos/sdks && mv /tmp/sdks/iPhoneOS14.5.sdk $HOME/theos/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload .tipa
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-tipa
          path: build/LocationSimulator.tipa
          if-no-files-found: error

      - name: Publish release (one per version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' Geranium.xcodeproj/project.pbxproj | awk '{print $3}')
          cp build/LocationSimulator.tipa "build/LocationSimulator_${VER}.tipa"
          # one release per version (older versions stay); a rebuild of the same version replaces it
          gh release delete build -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release delete "v${VER}" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "v${VER}" "build/LocationSimulator_${VER}.tipa" -R "$GITHUB_REPOSITORY" \
            --title "Location Simulator ${VER}" \
            --notes "Built at $(TZ=Asia/Ho_Chi_Minh date '+%H:%M, %d/%m/%Y') (UTC+7). Open LocationSimulator_${VER}.tipa with TrollStore to install." \
            --target "$GITHUB_SHA" --latest
