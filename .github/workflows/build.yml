name: Build LocSim .tipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pick Xcode
        run: |
          ls /Applications | grep -i xcode
          XC=$(ls -d /Applications/Xcode_15.4.app 2>/dev/null || ls -d /Applications/Xcode_15*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install ldid, make, Theos
        run: |
          brew install ldid make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS14.5.sdk
          mkdir -p $HOME/theos/sdks && mv /tmp/sdks/iPhoneOS14.5.sdk $HOME/theos/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload .tipa
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-tipa
          path: build/Geranium.tipa
          if-no-files-found: error

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create build build/Geranium.tipa -R "$GITHUB_REPOSITORY" \
            --title "Location Simulator (bản mới nhất)" \
            --notes "Bản build lúc $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y'). Mở file Geranium.tipa bằng TrollStore." \
            --target "$GITHUB_SHA" --latest
